name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. 1.01, v1.10.32)'
        required: false
        type: string
  push:
    branches:
      - master
      - main
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3.2.0
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '12266719'
        packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

    - name: Install NDK
      run: |
        # setup-android 导出的是 ANDROID_SDK_ROOT，显式同步到 ANDROID_HOME
        export ANDROID_HOME="$ANDROID_SDK_ROOT"
        echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
        # sdkmanager 已在 PATH 中（cmdline-tools/16.0/bin），不要再写 latest 路径
        yes | sdkmanager --install "ndk;28.2.13676358"
        echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
        # 用正则插入，避免依赖固定行号
        sed -i '/compileSdk = 35/a\        ndkVersion = "28.2.13676358"' "${{ github.workspace }}/KNcloud/app/build.gradle.kts"

    - name: Restore cached libtun2socks
      id: cache-libtun2socks-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/libs
        key: libtun2socks-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('hev-socks5-tunnel/**') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libtun2socks
      if: steps.cache-libtun2socks-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libtun2socks
      if: steps.cache-libtun2socks-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/libs
        key: libtun2socks-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('hev-socks5-tunnel/**') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libtun2socks
      run: |
        mkdir -p ${{ github.workspace }}/KNcloud/app/libs
        cp -r ${{ github.workspace }}/libs/. ${{ github.workspace }}/KNcloud/app/libs/

    - name: Setup Go (AnyTLS plugin)
      uses: actions/setup-go@v5
      with:
        go-version-file: anytls-plugin/go.mod
        cache-dependency-path: anytls-plugin/go.sum

    - name: Build libanytls (AnyTLS plugin)
      run: |
        bash compile-anytls.sh "${{ github.workspace }}/KNcloud/app/libs"

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        # 子模块默认不 fetch tag，必须显式拉取，否则 git describe 取不到
        git fetch --tags --force
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.12
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: KNcloud/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v4.7.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build APK (unsigned)
      run: |
        cd ${{ github.workspace }}/KNcloud
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseReleaseReport
        ./gradlew testReleaseUnitTest --tests com.v2ray.ang.TrustedDomainTest assembleRelease

    - name: Sign APK (key rotation)
      env:
        KN_SIGNING_PASSPHRASE: ${{ secrets.KN_SIGNING_PASSPHRASE }}
      run: |
        set -euo pipefail
        # No fallback key: an APK signed with anything else could not update existing installs
        if [ -z "$KN_SIGNING_PASSPHRASE" ]; then echo "::error::Missing secret KN_SIGNING_PASSPHRASE"; exit 1; fi
        KEYDIR="$RUNNER_TEMP/keys"
        mkdir -p "$KEYDIR" && chmod 700 "$KEYDIR"
        openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:KN_SIGNING_PASSPHRASE \
          -in signing/keys.tar.gz.enc | tar -xzf - -C "$KEYDIR"
        APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
        shopt -s globstar nullglob
        APKS=(KNcloud/app/build/outputs/apk/**/release/*.apk)
        [ ${#APKS[@]} -gt 0 ] || { echo "::error::No APK found"; exit 1; }
        for apk in "${APKS[@]}"; do
          "$APKSIGNER" sign \
            --ks "$KEYDIR/old.p12" --ks-key-alias kncloud --ks-pass "file:$KEYDIR/old.pass" \
            --next-signer \
            --ks "$KEYDIR/new.p12" --ks-key-alias kncloud2026 --ks-pass "file:$KEYDIR/new.pass" \
            --lineage signing/lineage.bin --rotation-min-sdk-version 28 \
            --out "$apk.signed" "$apk"
          mv "$apk.signed" "$apk"
          rm -f "$apk.idsig"
          "$APKSIGNER" verify --print-certs "$apk" | grep -q 2c9608f219de706a6bb254029f636777dc9ac7d81bdab8cb02d2acd836163299
        done
        rm -rf "$KEYDIR"

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/KNcloud/app/build/outputs/apk/**/release/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/KNcloud/app/build/outputs/apk/**/release/*armeabi-v7a*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: x86-apk
        path: ${{ github.workspace }}/KNcloud/app/build/outputs/apk/**/release/*x86*.apk

    - name: Upload x86_64 APK
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: x86_64-apk
        path: ${{ github.workspace }}/KNcloud/app/build/outputs/apk/**/release/*x86_64*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: universal-apk
        path: ${{ github.workspace }}/KNcloud/app/build/outputs/apk/**/release/*universal*.apk

    - name: Determine Release Tag
      id: release_info
      run: |
        if [ -n "${{ github.event.inputs.release_tag }}" ]; then
          echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
        elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
        else
          echo "should_release=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload to release
      uses: svenstaro/upload-release-action@v2
      if: steps.release_info.outputs.should_release == 'true'
      with:
        file: ${{ github.workspace }}/KNcloud/app/build/outputs/apk/**/release/*.apk
        tag: ${{ steps.release_info.outputs.tag }}
        file_glob: true
        overwrite: true
        prerelease: false
